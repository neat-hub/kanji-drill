<!DOCTYPE html>  
<html lang="ja">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0f8ff">
<meta name="description" content="小学生向けの無料手書き漢字ドリル。学年別の漢字を、書き順を確認しながら練習できます。">  
<title>小学生 手書き漢字ドリル｜無料で練習</title>  
<style>  
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}  
html{scroll-behavior:smooth} body{margin:0;padding:clamp(8px,2.5vw,18px);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:#f0f8ff;color:#333;display:flex;justify-content:center}  
.container{width:100%;max-width:700px;min-width:0;background:#fff;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:18px;text-align:center}  
h1{font-size:1.3rem;color:#1e88e5;margin:0 0 12px}  
.grade-bar,.settings-bar{display:flex;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}  
.grade-btn,.mode-btn{padding:8px 13px;font:inherit;font-size:.92rem;font-weight:bold;border:2px solid #b0bec5;background:#fff;color:#455a64;border-radius:12px;cursor:pointer}  
.mode-btn{border-radius:999px;border-color:#90caf9;color:#1976d2}  
.grade-btn.active{background:#ff9800;color:#fff;border-color:#f57c00}  
.mode-btn.active{background:#1976d2;color:#fff;border-color:#1976d2}  
.grade-btn.special{border-color:#ef5350;color:#d32f2f}  
.grade-btn.special.active{background:#e53935;color:#fff}  
.reward-bar{display:flex;justify-content:space-between;align-items:center;background:#fff8e1;border:2px solid #ffd54f;border-radius:14px;padding:8px 14px;margin-bottom:12px;font-size:.92rem;font-weight:bold;color:#5d4037;flex-wrap:wrap;gap:6px}  
.reward-badge{background:#fff;padding:3px 10px;border-radius:999px;border:1px solid #ffe082;margin-right:6px;display:inline-block}  
.btn-stamp-book{background:#ff8f00;color:#fff;border:none;border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;font-weight:bold;cursor:pointer}  
.progress-bar{display:flex;justify-content:space-between;background:#e3f2fd;padding:8px 16px;border-radius:12px;margin-bottom:10px;font-weight:bold;color:#555}  
.question-box{background:#fffde7;border:3px solid #ffe082;border-radius:16px;padding:14px;margin-bottom:14px}  
.reading-label{display:inline-block;background:#ff9800;color:#fff;font-size:.9rem;font-weight:bold;padding:3px 12px;border-radius:999px}  
.reading-text{font-size:1.8rem;font-weight:bold;color:#e65100;margin:4px 0 8px;letter-spacing:.08em}  
.sentence-text{font-size:1.3rem;line-height:1.6}  
.target-blank{display:inline-block;background:#fff;border:2px dashed #ff9800;color:#e65100;font-weight:bold;padding:0 10px;margin:0 4px;border-radius:8px}  
.canvas-area{position:relative;width:min(380px,100%);max-width:100%;aspect-ratio:1/1;margin:0 auto 14px;border:4px solid #4caf50;border-radius:16px;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}  
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}  
#guideSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}  
.stroke-count-badge{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.92);border:1px solid #ccc;border-radius:8px;padding:2px 8px;font-size:.85rem;font-weight:bold;color:#555;pointer-events:none}  
.toast-msg{display:none;background:#ff7043;color:#fff;font-weight:bold;padding:10px 16px;border-radius:12px;margin-bottom:12px}  
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}  
.action-btn{font:inherit;font-size:1.05rem;font-weight:bold;padding:12px 18px;border:none;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}  
.action-btn:active{transform:translateY(2px)}  
.action-btn:disabled{opacity:.45;cursor:not-allowed}  
.btn-undo{background:#eceff1;color:#37474f}.btn-clear{background:#ffebee;color:#c62828}  
.btn-check{background:#4caf50;color:#fff}.btn-next{background:#1e88e5;color:#fff}  
.btn-replay{background:#fff3e0;color:#ef6c00}.btn-retry-wrong{background:#ff7043;color:#fff}  
.feedback-box{display:none;margin-top:10px;padding:14px;border-radius:14px;font-size:1.1rem;font-weight:bold;line-height:1.55}  
.feedback-ok{background:#e8f5e9;border:2px solid #66bb6a;color:#2e7d32}  
.feedback-ng{background:#fff3e0;border:2px solid #ffa726;color:#d84315}  
.feedback-info{background:#e3f2fd;border:2px solid #64b5f6;color:#1565c0}  
.result-screen,.empty-notice{display:none}  
.empty-notice{background:#fff3e0;border:2px solid #ffb74d;border-radius:14px;padding:20px;margin:16px 0;font-weight:bold;color:#e65100}  
.hanamaru{font-size:5rem;margin:10px 0}  
.score-text{font-size:1.7rem;font-weight:bold;color:#e65100;margin-bottom:14px}  
.review-list{text-align:left;background:#fafafa;border-radius:12px;padding:12px;margin-bottom:16px}  
.review-item{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid #eee}  
.review-kanji{font-size:1.6rem;font-weight:bold;color:#1976d2;margin-right:10px}  
.loading-msg{color:#666;font-size:.95rem;margin:8px 0;display:none}  
.reward-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center;padding:16px}  
.reward-modal-content{background:#fff;border-radius:20px;max-width:500px;width:100%;padding:20px;max-height:85vh;overflow-y:auto}  
.grade-progress-row{display:flex;align-items:center;padding:10px 8px;border-bottom:1px solid #eee;font-size:.95rem}  
.progress-track{flex:1;height:12px;background:#eceff1;border-radius:999px;margin:0 10px;overflow:hidden}  
.progress-fill{height:100%;background:#4caf50}  

/* 公開版：スマートフォン・タブレット・キーボード操作への配慮 */
button{min-height:42px}
button:focus-visible{outline:3px solid #0d47a1;outline-offset:3px}
.grade-btn,.mode-btn,.action-btn,.btn-stamp-book{touch-action:manipulation}
.progress-bar{gap:8px;flex-wrap:wrap}
.reward-bar>div{display:flex;gap:6px;flex-wrap:wrap}
.reward-badge{margin-right:0}
.canvas-area{width:min(380px,100%);aspect-ratio:1/1}
#drawCanvas{width:100%;height:100%}
.help-note{max-width:560px;margin:8px auto 14px;color:#546e7a;font-size:.88rem;line-height:1.6}
.app-footer{margin-top:18px;padding-top:10px;border-top:1px solid #e8eef2;color:#607d8b;font-size:.78rem;line-height:1.6}
@media(max-width:480px){
  body{padding:6px}
  .container{padding:12px;border-radius:14px}
  h1{font-size:1.12rem}
  .grade-btn,.mode-btn{padding:8px 10px;font-size:.86rem}
  .question-box{padding:10px}
  .reading-text{font-size:1.55rem}
  .sentence-text{font-size:1.12rem}
  .action-btn{font-size:.94rem;padding:11px 13px;flex:1 1 auto}
  .controls{gap:8px}
  .progress-bar{font-size:.88rem;padding:8px 10px}
  .reward-bar{justify-content:center}
  .reward-modal-content{padding:16px}
  .review-item{gap:8px;align-items:center}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>  
</head>  
<body>  
<div class="container">  
  <h1 id="appTitle">✏️ しょうがくせい てがきかんじドリル</h1>
  <p class="help-note">よみがなと れいぶんを みて、みどりの わくの中に かんじを かこう。かきおわったら「こたえあわせ」を おしてね。</p>  
  <div class="reward-bar">  
    <div><span class="reward-badge" id="todayCountBadge"></span><span class="reward-badge" id="gradeMasterBadge"></span></div>  
    <button class="btn-stamp-book" id="stampBookBtn" onclick="openRewardModal()">🏆 きろくを見る</button>  
  </div>  
  <div class="reward-modal" id="rewardModal" onclick="if(event.target===this)closeRewardModal()">  
    <div class="reward-modal-content">  
      <h2 style="margin-top:0;color:#e65100" id="modalTitle">🏆 がんばりスタンプ帳</h2>  
      <div id="modalSummary" style="font-weight:bold;margin-bottom:12px"></div>  
      <div id="modalGradeList" style="margin-bottom:16px"></div>  
      <div id="storageNote" style="font-size:.8rem;color:#888;margin-bottom:12px"></div>  
      <button class="action-btn btn-next" onclick="closeRewardModal()">とじる</button>  
    </div>  
  </div>  
  <div class="grade-bar">  
    <button class="grade-btn active" onclick="changeGrade('1',this)">1ねん</button>  
    <button class="grade-btn" onclick="changeGrade('2',this)">2ねん</button>  
    <button class="grade-btn" onclick="changeGrade('3',this)">3ねん</button>  
    <button class="grade-btn" onclick="changeGrade('4',this)">4ねん</button>  
    <button class="grade-btn" onclick="changeGrade('5',this)">5年</button>  
    <button class="grade-btn" onclick="changeGrade('6',this)">6年</button>  
    <button class="grade-btn special" onclick="changeGrade('tricky',this)">🔥 筆順とっくん</button>  
  </div>  
  <div class="settings-bar">  
    <button class="mode-btn active" id="btnSet5" onclick="changeSetSize(5,this)">1かい 5もん</button>  
    <button class="mode-btn" id="btnSet10" onclick="changeSetSize(10,this)">1かい 10もん</button>  
  </div>  
  <div class="empty-notice" id="emptyNotice"></div>

  <div id="quizScreen">  
    <div class="progress-bar"><span id="progressText"></span><span id="gradeBadge"></span></div>  
    <div class="question-box">  
      <div class="reading-label" id="readingLabel">よみがな</div>  
      <div class="reading-text" id="readingText"></div>  
      <div class="sentence-text" id="sentenceText"></div>  
    </div>  
    <div class="loading-msg" id="loadingMsg" role="status" aria-live="polite">おてほんを よみこみちゅう...</div>  
    <div class="canvas-area" role="group" aria-label="漢字を書く場所">  
      <canvas id="drawCanvas" width="380" height="380" aria-label="指またはマウスで漢字を書くキャンバス"></canvas>  
      <svg id="guideSvg" viewBox="0 0 109 109"></svg>  
      <div class="stroke-count-badge" id="strokeBadge" aria-live="polite">0 かく</div>  
    </div>  
    <div class="toast-msg" id="toastMsg" role="status" aria-live="polite"></div>  
    <div class="controls" id="drawControls">  
      <button class="action-btn btn-undo" id="undoBtn" onclick="undoStroke()">↩️ 1かく もどる</button>  
      <button class="action-btn btn-clear" id="clearBtn" onclick="clearCanvas()">🗑️ ぜんぶ けす</button>  
      <button class="action-btn btn-check" id="checkBtn" onclick="checkAnswer()">⭕ こたえあわせ</button>  
    </div>  
    <div class="feedback-box" id="feedbackBox" role="status" aria-live="polite">  
      <div id="feedbackMessage"></div>  
      <div id="answerKanjiDisplay" style="font-size:1.3rem;margin-top:6px"></div>  
      <div class="controls" style="margin-top:12px;margin-bottom:0">  
        <button class="action-btn btn-replay" id="replayBtn" onclick="playStrokeAnimation()">▶️ かきじゅんを みる</button>  
        <button class="action-btn btn-next" id="nextBtn" onclick="nextQuestion()">つぎの もんだいへ ➡️</button>  
      </div>  
    </div>  
  </div>

  <div class="result-screen" id="resultScreen">  
    <div class="hanamaru" id="hanamaruIcon">💮</div>  
    <div class="score-text" id="finalScoreText"></div>  
    <div class="review-list" id="reviewList"></div>  
    <div class="controls">  
      <button class="action-btn btn-retry-wrong" id="retryWrongBtn" style="display:none" onclick="startWrongReview()"></button>  
      <button class="action-btn btn-check" id="restartBtn" onclick="startNewSet()">🔄 もういちど ちょうせんする</button>  
    </div>  
  </div>  
</div>

// ---------- 安全な保存（Googleサイト埋め込みで localStorage が使えなくても止まらない） ----------  
const safeStore = (function(){  
  var mem = {}, ok = false;  
  try { var k='__kanji_drill_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok = true; } catch(e){}  
  return {  
    get persistent(){ return ok; },  
    getItem: function(k){  
      try { if (ok) return localStorage.getItem(k); } catch(e){ ok=false; }  
      return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null;  
    },  
    setItem: function(k,v){  
      try { if (ok) { localStorage.setItem(k,v); return; } } catch(e){ ok=false; }  
      mem[k]=v;  
    },  
    keys: function(){  
      try { if (ok) return Object.keys(localStorage); } catch(e){ ok=false; }  
      return Object.keys(mem);  
    },  
    removeItem: function(k){  
      try { if (ok) localStorage.removeItem(k); } catch(e){ ok=false; }  
      delete mem[k];  
    }  
  };  
})();

async function fetchOne(url){  
  var c=new AbortController(), t=setTimeout(function(){ c.abort(); },6000);  
  try {  
    var r=await fetch(url,{signal:c.signal});  
    if(!r.ok) throw new Error('HTTP '+r.status);  
    return await r.text();  
  } finally { clearTimeout(t); }  
}

async function fetchKanjiStrokes(ch){  
  if(memCache[ch]) return memCache[ch];  
  var key='kvg_v2_'+ch;  
  try { var c=safeStore.getItem(key); if(c){ var d=JSON.parse(c); memCache[ch]=d; return d; } } catch(e){}

  var hex=ch.codePointAt(0).toString(16).padStart(5,'0');  
  var urls=[  
    'https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/'+hex+'.svg',  
    'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/'+hex+'.svg'  
  ];  
  var svgText=null, lastErr=null;  
  for(var i=0;i<urls.length && !svgText;i++){  
    try { svgText = await fetchOne(urls[i]); } catch(e){ lastErr=e; }  
  }  
  if(!svgText) throw lastErr || new Error('fetch failed');

  var doc=new DOMParser().parseFromString(svgText,'image/svg+xml');  
  var els=doc.querySelectorAll('[id^="kvg:StrokePaths_"] path');  
  if(els.length===0) els=doc.querySelectorAll('path');

  var tmp=document.createElementNS('http://www.w3.org/2000/svg','svg');  
  tmp.setAttribute('viewBox','0 0 109 109');  
  tmp.style.cssText='position:absolute;width:0;height:0;pointer-events:none';  
  document.body.appendChild(tmp);  
  var sampled=[], raw=[];  
  try {  
    els.forEach(function(p){  
      var d=p.getAttribute('d'); if(!d) return;  
      raw.push(d);  
      var cl=document.createElementNS('http://www.w3.org/2000/svg','path');  
      cl.setAttribute('d',d); tmp.appendChild(cl);  
      var len=cl.getTotalLength(), pts=[];  
      for(var k=0;k<=15;k++){ var pt=cl.getPointAtLength(len*k/15); pts.push({x:Math.round(pt.x*10)/10,y:Math.round(pt.y*10)/10}); }  
      sampled.push(pts);  
    });  
  } finally { if(tmp.parentNode) tmp.parentNode.removeChild(tmp); }  
  if(sampled.length===0) throw new Error('no strokes');

  var result={sampledStrokes:sampled,rawPaths:raw};  
  memCache[ch]=result;  
  try { safeStore.setItem(key,JSON.stringify(result)); } catch(e){}  
  return result;  
}

// ---------- 描画 ----------  
function setupCanvasEvents(){  
  function pos(e){  
    var r=canvas.getBoundingClientRect(), w=r.width||canvas.width, h=r.height||canvas.height;  
    return {x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)/w*canvas.width)), y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)/h*canvas.height))};  
  }  
  canvas.addEventListener('pointerdown',function(e){  
    if(isAnswered||isDrawing) return;  
    if(e.pointerType==='touch' && !e.isPrimary) return;  
    e.preventDefault(); hideToast();  
    isDrawing=true; activePointerId=e.pointerId;  
    try{ canvas.setPointerCapture(e.pointerId); }catch(x){}  
    currentStroke=[pos(e)]; redrawCanvas();  
  });  
  canvas.addEventListener('pointermove',function(e){  
    if(!isDrawing||e.pointerId!==activePointerId||isAnswered) return;  
    e.preventDefault(); currentStroke.push(pos(e)); redrawCanvas();  
  });  
  function finish(e){  
    if(!isDrawing||e.pointerId!==activePointerId) return;  
    isDrawing=false; activePointerId=null;  
    try{ canvas.releasePointerCapture(e.pointerId); }catch(x){}  
    if(currentStroke.length>1) userStrokes.push(currentStroke);  
    else if(currentStroke.length===1) userStrokes.push([currentStroke[0],{x:currentStroke[0].x+.5,y:currentStroke[0].y+.5}]);  
    currentStroke=[]; redrawCanvas();  
  }  
  canvas.addEventListener('pointerup',finish);  
  canvas.addEventListener('pointercancel',finish);  
}  
function drawGrid(){  
  var w=canvas.width,h=canvas.height;  
  ctx.save(); ctx.strokeStyle='#c8e6c9'; ctx.lineWidth=1.5; ctx.setLineDash([6,6]);  
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();  
  ctx.restore();  
}  
function drawStroke(pts,color){  
  if(!pts||!pts.length) return;  
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';  
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);  
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);  
  ctx.stroke(); ctx.restore();  
}  
function redrawCanvas(colors){  
  ctx.clearRect(0,0,canvas.width,canvas.height); drawGrid();  
  userStrokes.forEach(function(s,i){ drawStroke(s,(colors&&colors[i])?colors[i]:'#263238'); });  
  if(currentStroke.length) drawStroke(currentStroke,'#1976d2');  
  $('strokeBadge').textContent = userStrokes.length+' '+(isUpper()?'画':'かく');  
}  
function undoStroke(){ if(isAnswered||!userStrokes.length) return; hideToast(); userStrokes.pop(); redrawCanvas(); }  
function clearCanvas(){ if(isAnswered) return; hideToast(); userStrokes=[]; currentStroke=[]; redrawCanvas(); }

// ---------- 判定 ----------  
function resample(pts,steps){  
  if(pts.length===1) return Array(steps+1).fill(pts[0]);  
  var total=0, ds=[0];  
  for(var i=1;i<pts.length;i++){ total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); ds.push(total); }  
  if(total===0) return Array(steps+1).fill(pts[0]);  
  var out=[];  
  for(var s=0;s<=steps;s++){  
    var tg=total*s/steps, idx=1;  
    while(idx<ds.length-1 && ds[idx]<tg) idx++;  
    var seg=ds[idx]-ds[idx-1], t=seg===0?0:(tg-ds[idx-1])/seg;  
    out.push({x:pts[idx-1].x+(pts[idx].x-pts[idx-1].x)*t, y:pts[idx-1].y+(pts[idx].y-pts[idx-1].y)*t});  
  }  
  return out;  
}  
function bbox(list){  
  var a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;  
  list.forEach(function(s){ s.forEach(function(p){ if(p.x<a)a=p.x; if(p.y<b)b=p.y; if(p.x>c)c=p.x; if(p.y>d)d=p.y; }); });  
  return {w:Math.max(c-a,1),h:Math.max(d-b,1),cx:(a+c)/2,cy:(b+d)/2};  
}  
function dist(s1,s2){ var t=0; for(var i=0;i<s1.length;i++) t+=Math.hypot(s1[i].x-s2[i].x,s1[i].y-s2[i].y); return t/s1.length; }  
function dirSim(s1,s2){  
  var p1=Math.floor(s1.length/3), p2=Math.floor(s1.length*2/3), last=s1.length-1;  
  function vs(a1,a2,b1,b2){  
    var x1=a2.x-a1.x,y1=a2.y-a1.y,x2=b2.x-b1.x,y2=b2.y-b1.y, l1=Math.hypot(x1,y1), l2=Math.hypot(x2,y2);  
    if(l1<2.5||l2<2.5) return 1;  
    return (x1*x2+y1*y2)/(l1*l2);  
  }  
  return Math.min(vs(s1[0],s1[p1],s2[0],s2[p1]), vs(s1[p1],s1[p2],s2[p1],s2[p2]), vs(s1[p2],s1[last],s2[p2],s2[last]));  
}

function checkAnswer(){  
  var u=isUpper();  
  if(!userStrokes.length){ showToast(u?'まずは枠の中に漢字を書いてください！':'まずは しかくの なかに かんじを かいてね！'); return; }  
  hideToast();  
  var target=questions[currentIndex][0];

  // お手本が取れなかった場合：正解扱いにせず、自分で見くらべてもらう（記録にも数えない）  
  if(currentRefStrokes.length===0){  
    showResultFeedback('info', u?'お手本を読み込めませんでした。上の漢字と見くらべて、自分で確かめましょう。':'おてほんが よみこめなかったよ。したの かんじと みくらべてみよう。', target);  
    return;  
  }

  var expected=currentRefStrokes.length, actual=userStrokes.length;  
  var raw=userStrokes.map(function(s){ return resample(s,15); });  
  var ub=bbox(raw), rb=bbox(currentRefStrokes);  
  var scale=Math.max(rb.w,rb.h,35)/Math.max(ub.w,ub.h,85);  
  var norm=raw.map(function(st){ return st.map(function(p){ return {x:(p.x-ub.cx)*scale+rb.cx, y:(p.y-ub.cy)*scale+rb.cy}; }); });

  var colors=[], firstErr='', n=Math.min(actual,expected);  
  for(var i=0;i<n;i++){  
    var us=norm[i], rs=currentRefStrokes[i], rev=rs.slice().reverse();  
    var dN=dist(us,rs), dR=dist(us,rev);  
    var sD=Math.hypot(us[0].x-rs[0].x,us[0].y-rs[0].y), eD=Math.hypot(us[15].x-rs[15].x,us[15].y-rs[15].y);  
    var ok = dN<26 && sD<33 && eD<33 && dirSim(us,rs)>0.25 && dN<dR;  
    if(ok){ colors.push('#2e7d32'); continue; }  
    colors.push('#e53935');  
    if(firstErr) continue;  
    if(dR<25 && dR<dN){ firstErr = u ? (i+1)+'画目の書く向きが逆です！' : (i+1)+'かくめの かく むきが ぎゃくだよ！'; }  
    else {  
      var other=-1;  
      for(var j=0;j<expected;j++){ if(j!==i && dist(us,currentRefStrokes[j])<23 && dirSim(us,currentRefStrokes[j])>0.3){ other=j; break; } }  
      if(other!==-1) firstErr = u ? (i+1)+'画目は、本当は'+(other+1)+'画目に書く線です！' : (i+1)+'かくめは、ほんとうは '+(other+1)+'かくめに かく せんだよ！';  
      else firstErr = u ? (i+1)+'画目の形や書き始めの場所が違います！' : (i+1)+'かくめの かたちや ばしょが ちがうよ！';  
    }  
  }  
  for(var k=n;k<actual;k++) colors.push('#e53935');  
  redrawCanvas(colors);

  if(actual!==expected){  
    var ct = u ? '画数が違います！（正しくは '+expected+'画）' : 'かくすうが ちがうよ！（ただしくは '+expected+'かく）';  
    showResultFeedback('ng', firstErr ? ct+'<br>'+(u?'また、':'あと、')+firstErr : ct, target);  
  } else if(firstErr){ showResultFeedback('ng', firstErr, target); }  
  else showResultFeedback('ok', u?'大正解！書き順も画数もばっちりです！':'だいせいかい！ かきじゅんも かくすうも ばっちり！', target);  
}

function showResultFeedback(kind,msg,target){

  $('drawControls').style.display='none';var fb=$('feedbackBox'); fb.style.display='block';  
  fb.className='feedback-box '+(kind==='ok'?'feedback-ok':kind==='ng'?'feedback-ng':'feedback-info');  
  $('feedbackMessage').innerHTML=(kind==='ok'?'💮 ':kind==='ng'?'💡 ':'ℹ️ ')+msg;  
  $('answerKanjiDisplay').innerHTML=(isUpper()?'答え：':'こたえ：')+' <strong style="font-size:2rem;color:#1976d2">'+target+'</strong>';  
  if(kind==='info'){  
    results.push({kanji:target,reading:questions[currentIndex][1],isCorrect:false,rawItem:questions[currentIndex]});  
    return;  
  }  
  results.push({kanji:target,reading:questions[currentIndex][1],isCorrect:kind==='ok',rawItem:questions[currentIndex]});  
  if(kind==='ok') recordCorrectAnswer(target,questions[currentIndex][3]); else playStrokeAnimation();  
}

function playStrokeAnimation(){  
  if(animTimer) clearInterval(animTimer);  
  var svg=$('guideSvg'); svg.innerHTML='';  
  if(!currentRawPaths.length) return;  
  var NS='http://www.w3.org/2000/svg';  
  function mk(tag,attrs){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); return e; }  
  currentRawPaths.forEach(function(d){  
    svg.appendChild(mk('path',{d:d,fill:'none',stroke:'rgba(25,118,210,.18)','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'}));  
  });  
  var idx=0;  
  function next(){  
    if(idx>=currentRawPaths.length){ clearInterval(animTimer); return; }  
    var p=mk('path',{d:currentRawPaths[idx],fill:'none',stroke:'#1976d2','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'});  
    svg.appendChild(p);  
    var s=p.getPointAtLength(0), g=mk('g',{});  
    g.appendChild(mk('circle',{cx:s.x,cy:s.y,r:5.2,fill:'#fffde7',stroke:'#d32f2f','stroke-width':1.3}));  
    var t=mk('text',{x:s.x,y:s.y+2.1,'text-anchor':'middle','font-size':idx>=9?5.8:6.6,'font-weight':'bold',fill:'#c62828'});  
    t.textContent=String(idx+1); g.appendChild(t); svg.appendChild(g);  
    idx++;  
  }  
  next(); animTimer=setInterval(next,600);  
}

function nextQuestion(){ currentIndex++; if(currentIndex<questions.length) loadQuestion(); else showFinalResult(); }

function showFinalResult(){  
  var u=isUpper();  
  $('quizScreen').style.display='none'; $('resultScreen').style.display='block';  
  var total=results.length, ok=results.filter(function(r){ return r.isCorrect; }).length, ng=total-ok;  
  $('finalScoreText').textContent = u ? total+'問中 '+ok+'問 正解！' : total+'もんちゅう '+ok+'もん せいかい！';  
  $('hanamaruIcon').textContent=ok===total?'💮':(ok>=Math.ceil(total*.6)?'🎉':'🌱');var rb=$('retryWrongBtn');  
  if(ng>0){ rb.style.display='inline-block'; rb.textContent = u ? '💪 まちがえた漢字だけ復習する（'+ng+'問）' : '💪 まちがえた かんじだけ ふくしゅうする（'+ng+'もん）'; }  
  else rb.style.display='none';  
  var h='<div style="font-weight:bold;margin-bottom:8px;color:#555">'+(u?'今回の問題：':'こんかいの もんだい：')+'</div>';  
  results.forEach(function(r,i){  
    var lab = r.isCorrect ? (u?'⭕ 正解':'⭕ せいかい') : (u?'💪 もう一度':'💪 もういちど');  
    h+='<div class="review-item"><div><span style="color:#888;margin-right:8px">'+(i+1)+'.</span><span class="review-kanji">'+r.kanji+'</span><span>（'+r.reading+'）</span></div><div style="font-weight:bold;color:'+(r.isCorrect?'#2e7d32':'#e65100')+'">'+lab+'</div></div>';  
  });  
  $('reviewList').innerHTML=h;  
}

// ---------- ごほうび ----------  
const REWARD_KEY='kanji_drill_reward_v1';  
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }  
function loadStats(){  
  var t=todayStr(), def={todayDate:t,todayCount:0,totalCorrect:0,mastered:{"1":[],"2":[],"3":[],"4":[],"5":[],"6":[]}};  
  try {  
    var raw=safeStore.getItem(REWARD_KEY); if(!raw) return def;  
    var d=JSON.parse(raw);  
    if(!d.mastered) d.mastered=def.mastered;  
    if(d.todayDate!==t){ d.todayDate=t; d.todayCount=0; saveStats(d); }  
    return d;  
  } catch(e){ return def; }  
}  
function saveStats(d){ try{ safeStore.setItem(REWARD_KEY,JSON.stringify(d)); }catch(e){} }  
function rankIcon(c,t){ if(!t||!c) return '🌱'; var r=c/t; return r>=1?'👑':r>=.7?'🥇':r>=.4?'🥈':'🥉'; }  
function recordCorrectAnswer(k,g){  
  var s=loadStats(); s.todayCount++; s.totalCorrect++;  
  var key=String(g); if(!s.mastered[key]) s.mastered[key]=[];  
  if(s.mastered[key].indexOf(k)<0) s.mastered[key].push(k);  
  saveStats(s); renderRewardBar();  
}  
function renderRewardBar(){  
  var s=loadStats(), u=isUpper(), unit=u?'問':'もん';  
  $('todayCountBadge').textContent = (u?'☀️ 今日：':'☀️ きょう：')+s.todayCount+unit;  
  if(currentGrade==='tricky') $('gradeMasterBadge').textContent='🔥 累計正解：'+s.totalCorrect+'問';  
  else {  
    var total=KANJI_DATA.filter(function(i){ return String(i[3])===currentGrade; }).length;  
    var cl=(s.mastered[currentGrade]||[]).length;  
    $('gradeMasterBadge').textContent=rankIcon(cl,total)+' '+currentGrade+(u?'年：':'ねん：')+cl+' / '+total+'字';  
  }  
  $('stampBookBtn').textContent = u?'🏆 記録を見る':'🏆 きろくを見る';  
}  
function openRewardModal(){  
  var s=loadStats(), u=isUpper();  
  $('modalTitle').textContent = u?'🏆 がんばりスタンプ帳':'🏆 がんばり スタンプちょう';  
  $('modalSummary').textContent = u ? 'これまでの累計正解数：'+s.totalCorrect+' 問（今日：'+s.todayCount+'問）' : 'これまでの ごうけい せいかい：'+s.totalCorrect+' もん（きょう：'+s.todayCount+' もん）';  
  var h='';  
  for(var g=1;g<=6;g++){  
    var total=KANJI_DATA.filter(function(i){ return i[3]===g; }).length, cl=(s.mastered[String(g)]||[]).length;  
    var pct=total>0?Math.round(cl/total*100):0;  
    h+='<div class="grade-progress-row"><span style="font-weight:bold;min-width:68px">'+rankIcon(cl,total)+' '+g+'年生</span><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><span style="font-weight:bold;min-width:85px;text-align:right">'+cl+' / '+total+'字</span></div>';  
  }  
  $('modalGradeList').innerHTML=h;  
  $('storageNote').textContent = safeStore.persistent ? '' : '※ この表示方法では記録をずっと保存できません。ページを閉じると消えます。';  
  $('rewardModal').style.display='flex';  
}  
function closeRewardModal(){ $('rewardModal').style.display='none'; }

// ---------- 起動 ----------  
function initApp(){  
  try { setupCanvasEvents(); updateUILanguage(); startNewSet(); }  
  catch(err){ console.error('初期化エラー:',err); showToast('起動中に問題が発生しました。再読み込みしてください。'); }  
}  
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initApp); else initApp();  
</script>
